<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoPilot Publisher — OAuth Callback</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; text-align: center; }
        .code-box { background: #f0f0f0; border: 2px solid #333; border-radius: 8px; padding: 20px; margin: 20px 0; word-break: break-all; font-family: monospace; font-size: 14px; }
        .success { color: #25F4EE; }
        .error { color: #e94560; }
        button { background: #e94560; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #d63050; }
    </style>
</head>
<body>
    <div id="result"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const el = document.getElementById('result');

        if (error) {
            el.innerHTML = '<h1 class="error">Authorization Failed</h1><p>' + error + '</p>';
        } else if (code) {
            el.innerHTML = '<h1 class="success">&#10004; Authorization Successful!</h1>'
                + '<p>Channel: <strong>' + (state || 'unknown') + '</strong></p>'
                + '<p>Copy this authorization code and paste it into the terminal:</p>'
                + '<div class="code-box" id="code">' + code + '</div>'
                + '<button onclick="navigator.clipboard.writeText(\'' + code + '\');this.textContent=\'Copied!\'">Copy Code</button>'
                + '<p style="margin-top:20px;color:#666;">You can close this window after copying.</p>';
        } else {
            el.innerHTML = '<h1>Waiting for authorization...</h1>';
        }
    </script>
</body>
</html>
